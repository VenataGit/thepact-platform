<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Демо: Overtime на видеографите</title>
<style>
  :root { --bg:#111a1e; --card:#1b2930; --panel:rgba(255,255,255,.05); --hover:rgba(255,255,255,.07); --border:#1e3040;
          --text:#e6e6e6; --sec:#9aa7ad; --dim:#66798a; --green:#46a374; --amber:#f5a623; --red:#e5534b; --blue:#7fc8ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); font-size:13.5px; }
  button, input, select, textarea { font:inherit; }
  header { padding:12px 24px; background:var(--card); border-bottom:1px solid var(--border); display:flex; gap:14px; align-items:center; flex-wrap:wrap; position:sticky; top:0; z-index:20; }
  header h1 { font-size:15px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; background:rgba(245,166,35,.15); color:var(--amber); }
  .vtabs { display:flex; gap:6px; margin-left:auto; flex-wrap:wrap; }
  .vtab { padding:7px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--sec); cursor:pointer; font-weight:600; }
  .vtab.on { background:var(--green); border-color:var(--green); color:#fff; }
  .explain { max-width:1180px; margin:14px auto 0; padding:12px 16px; background:var(--card); border:1px solid var(--border); border-left:3px solid var(--amber); border-radius:10px; line-height:1.55; color:var(--sec); }
  .explain b { color:var(--text); }
  .page { max-width:1180px; margin:14px auto 40px; background:var(--panel); border-radius:15px; padding:22px 25px; }
  .head { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .head h2 { font-size:20px; }
  .dim { color:var(--sec); font-size:12.5px; }
  .pbtn { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:var(--text); border-radius:8px; padding:6px 12px; cursor:pointer; font-size:13px; }
  .pbtn:hover { background:rgba(255,255,255,.12); }
  .pbtn.on, .pbtn.primary { background:var(--green); border-color:var(--green); color:#fff; font-weight:600; }
  .pbtn.small { padding:3px 9px; font-size:12px; }
  .pbtn.red { border-color:rgba(229,83,75,.5); color:#ff8f88; }
  .pbtn.ok { border-color:rgba(70,163,116,.6); color:#8fd8b0; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:12px 0 14px; }
  .tile { background:rgba(255,255,255,.05); border-radius:12px; padding:14px 16px; text-align:center; }
  .tile b { display:block; font-size:22px; }
  .tile span { font-size:12px; color:var(--sec); }
  .box { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .box h3 { font-size:14px; margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-weight:600; color:var(--sec); font-size:12px; padding:7px 8px; border-bottom:1px solid rgba(255,255,255,.08); }
  td { padding:8px; border-bottom:1px solid rgba(255,255,255,.05); vertical-align:top; }
  td.num, th.num { text-align:right; white-space:nowrap; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:820px) { .grid2 { grid-template-columns:1fr; } }
  label.f { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--sec); margin-bottom:10px; }
  input, select, textarea { background:var(--bg); color:var(--text); border:1px solid rgba(255,255,255,.15); border-radius:7px; padding:7px 9px; font-size:13px; }
  textarea { resize:vertical; min-height:64px; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  .calc { border-radius:12px; padding:14px 16px; background:rgba(245,166,35,.08); border:1px solid rgba(245,166,35,.3); }
  .calc .big { font-size:28px; font-weight:700; color:var(--amber); }
  .calc.zero { background:rgba(255,255,255,.04); border-color:rgba(255,255,255,.1); }
  .calc.zero .big { color:var(--sec); }
  .calc ul { margin:8px 0 0 18px; color:var(--sec); line-height:1.6; }
  .warn { color:#ff8f88; font-size:12.5px; margin-top:6px; }
  .st { font-size:11.5px; padding:2px 8px; border-radius:999px; white-space:nowrap; }
  .st.pending { background:rgba(245,166,35,.15); color:var(--amber); }
  .st.approved { background:rgba(70,163,116,.18); color:#8fd8b0; }
  .st.rejected { background:rgba(229,83,75,.15); color:#ff8f88; }
  .tag { font-size:11.5px; padding:2px 8px; border-radius:999px; background:rgba(127,200,255,.12); color:var(--blue); white-space:nowrap; }
  .wk { font-size:11.5px; padding:2px 7px; border-radius:999px; background:rgba(229,83,75,.15); color:#ff8f88; white-space:nowrap; }
  .note { color:var(--sec); font-size:12.5px; margin-top:3px; }
  .empty { color:var(--sec); padding:6px 2px; }
  /* вариант 2 — календар */
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal .dn { text-align:center; color:var(--sec); font-size:12px; padding:4px 0; }
  .day { min-height:86px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07); border-radius:9px; padding:6px; cursor:pointer; display:flex; flex-direction:column; gap:3px; }
  .day:hover { background:var(--hover); }
  .day.off { background:rgba(229,83,75,.06); }
  .day.out { opacity:.3; cursor:default; }
  .day.sel { border-color:var(--green); box-shadow:0 0 0 1px var(--green) inset; }
  .day .d { font-size:12px; color:var(--sec); display:flex; justify-content:space-between; }
  .day .h { font-size:11.5px; padding:1px 6px; border-radius:6px; background:rgba(245,166,35,.18); color:var(--amber); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .layout2 { display:grid; grid-template-columns:1fr 340px; gap:14px; }
  @media (max-width:900px) { .layout2 { grid-template-columns:1fr; } }
  /* вариант 3 — линия на деня */
  .bar { position:relative; height:46px; border-radius:9px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); overflow:hidden; margin:8px 0 4px; }
  .bar .seg { position:absolute; top:0; bottom:0; }
  .bar .work { background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 6px,rgba(255,255,255,.03) 6px 12px); }
  .bar .lunch { background:rgba(255,255,255,.1); }
  .bar .ot { background:rgba(245,166,35,.75); }
  .bar .reg { background:rgba(70,163,116,.6); }
  .ticks { position:relative; height:16px; font-size:10.5px; color:var(--dim); }
  .ticks span { position:absolute; transform:translateX(-50%); }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--sec); margin-top:6px; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:5px; }
  input[type=range] { width:100%; padding:0; }
  .wkgroup h4 { font-size:13px; margin:12px 0 6px; display:flex; justify-content:space-between; color:var(--sec); }
  .mini { position:relative; height:8px; border-radius:4px; background:rgba(255,255,255,.06); margin-top:5px; overflow:hidden; }
  .mini .seg { position:absolute; top:0; bottom:0; }
  /* вариант 4 — телефон */
  .phone { width:360px; max-width:100%; margin:0 auto; background:var(--card); border:1px solid var(--border); border-radius:28px; padding:22px 18px; }
  .phone h3 { font-size:16px; margin-bottom:4px; }
  .bigbtn { width:100%; border:none; border-radius:16px; padding:22px; font-size:18px; font-weight:700; cursor:pointer; color:#fff; background:var(--green); margin:14px 0 8px; }
  .bigbtn.stop { background:var(--red); }
  .timer { text-align:center; font-size:40px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--amber); margin-top:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip { font-size:12.5px; padding:6px 11px; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); cursor:pointer; }
  .chip.on { background:var(--green); border-color:var(--green); color:#fff; }
  .card { background:rgba(255,255,255,.04); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  /* вариант 5 */
  .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:6px; }
  .hbar { height:8px; background:var(--amber); border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>⏱ Overtime на видеографите</h1>
  <span class="badge">ДЕМО — измислени данни, нищо не се записва</span>
  <div class="vtabs">
    <button class="vtab" data-v="1">1 · Форма</button>
    <button class="vtab" data-v="2">2 · Календар</button>
    <button class="vtab" data-v="3">3 · Линия на деня</button>
    <button class="vtab" data-v="4">4 · Старт/Стоп (телефон)</button>
    <button class="vtab" data-v="5">5 · Отчет за админ</button>
  </div>
</header>
<div class="explain" id="explain"></div>
<div class="page" id="page"></div>

<script>
// ───────── Правила ─────────
// Работно време: 10:00–19:00 в делничен ден (вкл. 1 ч обяд → 8 ч работа).
// Overtime = всичко ИЗВЪН 10:00–19:00 в делничен ден; в събота, неделя и официален празник — целият интервал.
// „До" по-малко от „От" = минава през полунощ (напр. 20:00 → 02:00 = 6 ч).
const WORK_FROM = 10 * 60, WORK_TO = 19 * 60;
const HOLIDAYS = { // официални почивни дни 2026
  '2026-01-01': 'Нова година', '2026-03-03': 'Освобождението', '2026-04-10': 'Разпети петък', '2026-04-13': 'Великден',
  '2026-05-01': 'Ден на труда', '2026-05-06': 'Гергьовден', '2026-05-25': '24 май (почивен)', '2026-09-07': 'Съединението (почивен)',
  '2026-09-22': 'Независимостта', '2026-12-24': 'Бъдни вечер', '2026-12-25': 'Коледа', '2026-12-26': 'Коледа'
};
const TODAY = '2026-11-02';

const people = [
  { id: 1, name: 'Иво П.' }, { id: 2, name: 'Мира С.' }, { id: 3, name: 'Ники Г.' }, { id: 4, name: 'Дани И.' }
];
const ME = 1;
const clients = ['Клиент А', 'Клиент Б', 'Клиент В', 'Клиент Г', 'Клиент Д', 'Вътрешно (The Pact)'];
const kinds = ['Снимки', 'Пътуване', 'Събитие', 'Монтаж', 'Техника / подготовка', 'Друго'];

let nextId = 100;
const E = (p, date, from, to, client, kind, note, status) => ({ id: nextId++, p, date, from, to, client, kind, note, status: status || 'approved' });
const entries = [
  E(1, '2026-10-03', '09:00', '14:00', 'Клиент А', 'Снимки', 'Събота — снимки в обекта, докато е затворен за клиенти. 3 видеа от КП-4.'),
  E(1, '2026-10-08', '19:00', '22:30', 'Клиент В', 'Събитие', 'Вечерно събитие — откриване, репортаж + интервюта.'),
  E(1, '2026-10-15', '07:00', '10:00', 'Клиент Б', 'Пътуване', 'Пътуване до Пловдив за снимачния ден.'),
  E(1, '2026-10-15', '19:00', '21:30', 'Клиент Б', 'Пътуване', 'Връщане от Пловдив.'),
  E(1, '2026-10-24', '20:00', '01:00', 'Клиент Г', 'Събитие', 'Нощно парти — заснемане за рийлс.'),
  E(1, '2026-10-29', '18:00', '20:30', 'Вътрешно (The Pact)', 'Техника / подготовка', 'Зареждане на батерии, форматиране, пакетиране за утре.', 'pending'),
  E(2, '2026-10-04', '10:00', '16:00', 'Клиент Д', 'Снимки', 'Неделя — снимки на ресторанта при пълна зала.'),
  E(2, '2026-10-16', '19:00', '21:00', 'Клиент А', 'Снимки', 'Залез — външни кадри.'),
  E(2, '2026-10-30', '19:00', '23:00', 'Клиент В', 'Събитие', 'Хелоуин събитие.', 'pending'),
  E(3, '2026-10-10', '08:00', '18:00', 'Клиент Б', 'Снимки', 'Събота — голям снимачен ден, 6 видеа.'),
  E(3, '2026-10-21', '06:30', '10:00', 'Клиент Г', 'Снимки', 'Изгрев — дрон кадри.', 'rejected'),
  E(3, '2026-10-27', '19:00', '20:00', 'Клиент Д', 'Монтаж', 'Спешна корекция по видео 3.', 'pending'),
  E(4, '2026-10-11', '11:00', '15:00', 'Клиент Г', 'Снимки', 'Неделя — турнир.'),
  E(4, '2026-10-22', '19:30', '22:00', 'Клиент А', 'Събитие', 'Дегустация.'),
  E(1, '2026-11-01', '12:00', '17:00', 'Клиент В', 'Снимки', 'Неделя — снимки в мола.', 'pending')
];

// ───────── Сметката ─────────
const toMin = (t) => { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
const pad = (n) => String(n).padStart(2, '0');
const hhmm = (m) => pad(Math.floor((m % 1440) / 60)) + ':' + pad(m % 60);
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseD = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const DOW = ['неделя', 'понеделник', 'вторник', 'сряда', 'четвъртък', 'петък', 'събота'];
const dayOff = (s) => { const w = parseD(s).getDay(); return HOLIDAYS[s] || (w === 0 || w === 6 ? (w === 0 ? 'неделя' : 'събота') : null); };
const fmtDate = (s) => { const d = parseD(s); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + ' (' + DOW[d.getDay()].slice(0, 3) + ')'; };
const fmtH = (m) => { if (!m) return '0 ч'; const h = Math.floor(m / 60), mm = m % 60; return (h ? h + ' ч' : '') + (h && mm ? ' ' : '') + (mm ? mm + ' мин' : ''); };
const decH = (m) => (m / 60).toFixed(m % 60 ? 2 : 0).replace('.', ',').replace(/,?0+$/, (x) => x.startsWith(',') ? '' : x);

// Връща { total, ot, parts:[{from,to,ot,label}], nextDay, error }
function calc(date, from, to) {
  if (!date || !from || !to) return { error: 'Попълни дата, от и до.' };
  const a = toMin(from); let b = toMin(to);
  if (a === b) return { error: '„От" и „До" са еднакви.' };
  const nextDay = b < a; if (nextDay) b += 1440;
  const parts = [];
  // обхождаме по денонощия (интервалът може да мине в следващия ден)
  for (let base = 0; base < b; base += 1440) {
    const day = addDays(date, base / 1440);
    const s = Math.max(a, base), e = Math.min(b, base + 1440);
    if (e <= s) continue;
    const off = dayOff(day);
    if (off) { parts.push({ from: s, to: e, ot: true, label: 'почивен ден (' + off + ')' }); continue; }
    const ws = base + WORK_FROM, we = base + WORK_TO;
    if (s < ws) parts.push({ from: s, to: Math.min(e, ws), ot: true, label: 'преди работно време' });
    if (e > ws && s < we) parts.push({ from: Math.max(s, ws), to: Math.min(e, we), ot: false, label: 'редовно работно време' });
    if (e > we) parts.push({ from: Math.max(s, we), to: e, ot: true, label: 'след работно време' });
  }
  const real = parts.filter((p) => p.to > p.from);
  const ot = real.filter((p) => p.ot).reduce((s, p) => s + p.to - p.from, 0);
  return { total: b - a, ot, parts: real, nextDay };
}
const otOf = (e) => calc(e.date, e.from, e.to).ot || 0;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const P = (id) => people.find((p) => p.id === id);
const STATUS = { pending: 'чака одобрение', approved: 'одобрен', rejected: 'отказан' };
const stBadge = (s) => '<span class="st ' + s + '">' + STATUS[s] + '</span>';
const opts = (arr, sel) => arr.map((x) => '<option' + (x === sel ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
const $ = (id) => document.getElementById(id);

function calcHtml(r) {
  if (r.error) return '<div class="calc zero"><div class="dim">' + esc(r.error) + '</div></div>';
  const li = r.parts.map((p) => '<li>' + hhmm(p.from) + '–' + hhmm(p.to) + ' · ' + fmtH(p.to - p.from) + ' — ' +
    (p.ot ? '<b style="color:var(--amber)">overtime</b>, ' : '<span>не се брои</span>, ') + p.label + '</li>').join('');
  return '<div class="calc' + (r.ot ? '' : ' zero') + '"><div class="dim">Overtime</div><div class="big">' + fmtH(r.ot) + '</div>' +
    '<div class="dim">Общо ' + fmtH(r.total) + (r.nextDay ? ' · минава през полунощ' : '') + '</div><ul>' + li + '</ul>' +
    (r.parts.some((p) => !p.ot) ? '<div class="warn">Част от времето е в редовното работно време (10:00–19:00) и не се брои.</div>' : '') +
    '</div>';
}

// Обща форма (ползва се във варианти 1, 2 и 3)
function formHtml(prefix, f) {
  return '<label class="f">Дата<input type="date" id="' + prefix + 'date" value="' + f.date + '"></label>' +
    '<div class="row"><label class="f">От<input type="time" id="' + prefix + 'from" value="' + f.from + '"></label>' +
    '<label class="f">До<input type="time" id="' + prefix + 'to" value="' + f.to + '"></label></div>' +
    '<div class="row"><label class="f">За кой клиент<select id="' + prefix + 'client">' + opts(clients, f.client) + '</select></label>' +
    '<label class="f">Какво<select id="' + prefix + 'kind">' + opts(kinds, f.kind) + '</select></label></div>' +
    '<label class="f">Подробности (какво точно, къде, с кого)<textarea id="' + prefix + 'note" placeholder="напр. Вечерно събитие — репортаж + 3 интервюта">' + esc(f.note || '') + '</textarea></label>';
}
const readForm = (prefix) => ({ date: $(prefix + 'date').value, from: $(prefix + 'from').value, to: $(prefix + 'to').value,
  client: $(prefix + 'client').value, kind: $(prefix + 'kind').value, note: $(prefix + 'note').value.trim() });
function addEntry(f, p) {
  const r = calc(f.date, f.from, f.to);
  if (r.error) { alert(r.error); return false; }
  if (!r.ot) { alert('Този интервал е изцяло в работно време — няма overtime.'); return false; }
  if (!f.note) { alert('Напиши накратко какво си правил.'); return false; }
  entries.push({ id: nextId++, p: p || ME, ...f, status: 'pending' });
  return true;
}
const sumOt = (list) => list.reduce((s, e) => s + otOf(e), 0);
const inMonth = (e, ym) => e.date.slice(0, 7) === ym;
const MONTHS = ['януари', 'февруари', 'март', 'април', 'май', 'юни', 'юли', 'август', 'септември', 'октомври', 'ноември', 'декември'];
const monthName = (ym) => MONTHS[Number(ym.slice(5)) - 1] + ' ' + ym.slice(0, 4);

function entryRows(list, withPerson, actions) {
  if (!list.length) return '<div class="empty">Няма записи.</div>';
  return '<table><tr><th>Дата</th>' + (withPerson ? '<th>Видеограф</th>' : '') + '<th>От–до</th><th>За кого / какво</th><th class="num">Overtime</th><th>Статус</th>' + (actions ? '<th></th>' : '') + '</tr>' +
    list.slice().sort((a, b) => (b.date + b.from).localeCompare(a.date + a.from)).map((e) => {
      const off = dayOff(e.date);
      return '<tr><td style="white-space:nowrap">' + fmtDate(e.date) + (off ? '<br><span class="wk">' + esc(off) + '</span>' : '') + '</td>' +
        (withPerson ? '<td>' + esc(P(e.p).name) + '</td>' : '') +
        '<td style="white-space:nowrap">' + e.from + '–' + e.to + (toMin(e.to) < toMin(e.from) ? ' <span class="dim">(+1 ден)</span>' : '') + '</td>' +
        '<td><b>' + esc(e.client) + '</b> <span class="tag">' + esc(e.kind) + '</span><div class="note">' + esc(e.note) + '</div></td>' +
        '<td class="num"><b>' + fmtH(otOf(e)) + '</b></td><td>' + stBadge(e.status) + '</td>' +
        (actions ? '<td style="white-space:nowrap">' + actions(e) + '</td>' : '') + '</tr>';
    }).join('') + '</table>';
}

  const monthAll = entries.filter((e) => inMonth(e, st.admMonth) && e.status !== 'rejected');
  const perP = people.map((p) => { const l = monthAll.filter((e) => e.p === p.id); return { p, l, ot: sumOt(l), off: sumOt(l.filter((e) => dayOff(e.date))), appr: sumOt(l.filter((e) => e.status === 'approved')) }; });
  const perC = clients.map((c) => ({ c, ot: sumOt(monthAll.filter((e) => e.client === c)) })).filter((x) => x.ot).sort((x, y) => y.ot - x.ot);
  const maxC = Math.max(1, ...perC.map((x) => x.ot));
  const pend = entries.filter((e) => inMonth(e, st.admMonth) && e.status === 'pending').length;
  $('page').innerHTML =
    '<div class="head"><h2>⏱ Overtime — отчет</h2>' + monthBtns('admMonth') + '<button class="pbtn" id="eCsv" style="margin-left:auto">⬇ CSV</button></div>' +
    '<div class="tiles"><div class="tile"><b>' + fmtH(sumOt(monthAll)) + '</b><span>общо overtime (без отказаните)</span></div>' +
    '<div class="tile"><b>' + fmtH(sumOt(monthAll.filter((e) => e.status === 'approved'))) + '</b><span>одобрени</span></div>' +
    '<div class="tile"><b style="color:var(--amber)">' + pend + '</b><span>чакат одобрение</span></div>' +
    '<div class="tile"><b>' + fmtH(sumOt(monthAll.filter((e) => dayOff(e.date)))) + '</b><span>от тях в почивни дни</span></div></div>' +
    '<div class="grid2"><div class="box"><h3>По видеограф</h3><table><tr><th>Видеограф</th><th class="num">Записи</th><th class="num">Overtime</th><th class="num">в почивни дни</th><th class="num">одобрени</th></tr>' +
      perP.map((x) => '<tr><td><a href="#" data-pp="' + x.p.id + '" style="color:var(--blue);text-decoration:none">' + esc(x.p.name) + '</a></td><td class="num">' + x.l.length + '</td><td class="num"><b>' + fmtH(x.ot) + '</b></td><td class="num">' + fmtH(x.off) + '</td><td class="num">' + fmtH(x.appr) + '</td></tr>').join('') + '</table></div>' +
    '<div class="box"><h3>По клиент</h3>' + (perC.length ? perC.map((x) => '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between"><span>' + esc(x.c) + '</span><b>' + fmtH(x.ot) + '</b></div><div class="hbar" style="width:' + (x.ot / maxC * 100) + '%"></div></div>').join('') : '<div class="empty">Няма.</div>') + '</div></div>' +
    '<div class="box"><h3>Всички записи</h3><div class="filters"><select id="eP"><option value="0">Всички видеографи</option>' + people.map((p) => '<option value="' + p.id + '"' + (st.admPerson === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + '</select>' +
    '<select id="eS"><option value="">Всички статуси</option>' + Object.keys(STATUS).map((k) => '<option value="' + k + '"' + (st.admStatus === k ? ' selected' : '') + '>' + STATUS[k] + '</option>').join('') + '</select>' +
    '<span class="dim">Общо в списъка: <b>' + fmtH(sumOt(list)) + '</b></span></div>' +
    entryRows(list, true, (e) => (e.status !== 'approved' ? '<button class="pbtn small ok" data-ap="' + e.id + '">✓ Одобри</button> ' : '') + (e.status !== 'rejected' ? '<button class="pbtn small red" data-rj="' + e.id + '">✕ Откажи</button>' : '')) + '</div>';
  bindMonth();
  $('eP').onchange = (ev) => { st.admPerson = Number(ev.target.value); render(); };
  $('eS').onchange = (ev) => { st.admStatus = ev.target.value; render(); };
  document.querySelectorAll('[data-pp]').forEach((a) => a.onclick = (ev) => { ev.preventDefault(); st.admPerson = Number(a.dataset.pp); render(); });
  document.querySelectorAll('[data-ap]').forEach((b) => b.onclick = () => { entries.find((e) => e.id === Number(b.dataset.ap)).status = 'approved'; render(); });
  document.querySelectorAll('[data-rj]').forEach((b) => b.onclick = () => { entries.find((e) => e.id === Number(b.dataset.rj)).status = 'rejected'; render(); });
  $('eCsv').onclick = () => {
    const q = (s) => '"' + String(s).replace(/"/g, '""') + '"';
    const rows = [['Дата', 'Видеограф', 'От', 'До', 'Overtime (ч)', 'Почивен ден', 'Клиент', 'Какво', 'Подробности', 'Статус']]
      .concat(list.map((e) => [e.date, P(e.p).name, e.from, e.to, decH(otOf(e)), dayOff(e.date) ? 'да' : 'не', e.client, e.kind, e.note, STATUS[e.status]]));
    const blob = new Blob(['﻿' + rows.map((r) => r.map(q).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'overtime-' + st.admMonth + '.csv'; a.click();
  };
}

document.querySelectorAll('.vtab').forEach((b) => b.onclick = () => {
  st.v = Number(b.dataset.v); clearInterval(tick);
  history.replaceState(null, '', '?v=' + st.v);
  render();
});
render();
</script>
</body>
</html>
